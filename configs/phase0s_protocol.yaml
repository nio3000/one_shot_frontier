protocol_name: ONE_SHOT_ESTIMABILITY_FRONTIER_PHASE0S
version: 0.9.0-PRE-FROZEN
status: PRE-FROZEN_BEFORE_IMPLEMENTATION
phase: Phase 0-S
purpose: smooth estimability surface locked confirmation

fixed:
