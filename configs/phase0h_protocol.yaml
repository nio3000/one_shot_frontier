  rho_nminus1_over_d: [0.25, 0.50, 0.75, 1.00, 1.50, 2.00, 4.00]
  seeds: [7000,7001,7002,7003,7004,7005,7006,7007,7008,7009,
          7010,7011,7012,7013,7014,7015,7016,7017,7018,7019,
          7020,7021,7022,7023,7024,7025,7026,7027,7028,7029]
